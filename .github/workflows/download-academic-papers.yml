name: Download academic papers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '学术论文/papers.json'
      - '学术论文/download_papers.py'
      - '学术论文/**/README.md'
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download PDFs
        run: python3 学术论文/download_papers.py
      - name: Commit downloaded PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '学术论文'
          if git diff --cached --quiet; then
            echo "No new PDFs"
          else
            git commit -m "docs: download academic paper PDFs"
            git push
          fi
